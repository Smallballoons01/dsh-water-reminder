name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The Harness packages this plugin develops against are on npm, but NOT
      # under the `latest` tag (npm's `latest` for @deepseek-ai/dsh-tools is
      # still the placeholder 0.0.1-rc.1). devDependencies pins the exact
      # versions, so a plain install resolves the real harness packages.
      - name: 安装依赖
        run: npm install --no-package-lock

      - name: 单元与集成测试
        run: npm test

      - name: 技能文件一致性
        run: npm run skill:check
